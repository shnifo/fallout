<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Integer &amp; Weapon Generator</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #1e1e2f; color: #eee; margin: 0; padding: 1rem; display: flex; flex-direction: column; align-items: center; }
h1,h2 { text-align:center; margin:.5rem 0; }
.container { background: #2a2a40; padding: 1rem; border-radius: 1rem; width: 100%; max-width: 400px; box-sizing: border-box; margin-bottom: 1rem; }
input[type=number], input[type=range], select, button { width:100%; padding:.5rem; border-radius:.5rem; border:none; text-align:center; margin-bottom:.6rem; font-size:1rem; box-sizing: border-box; }
button { background:#4e8cff; color:#fff; font-weight:bold; } button:hover { background:#2a6ce2; }
.bars { display:flex; justify-content:space-between; align-items:flex-end; height:120px; margin-top:1rem; }
.bar-container { display:flex; flex-direction:column; align-items:center; width:22%; }
.bar { width:100%; border-radius:.3rem; min-height:5px; transition:height .3s ease; display:flex; justify-content:center; align-items:flex-end; color:#fff; font-size:1rem; font-weight:bold; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; overflow:hidden; }
#bar1 { background:linear-gradient(180deg,#ff5e5e,#d43e3e); }
#bar2 { background:linear-gradient(180deg,#5ec8ff,#2e9ed4); }
#bar3 { background:linear-gradient(180deg,#ffbd5e,#e68b2e); }
#bar4 { background:linear-gradient(180deg,#5eff7d,#2ed451); }
.label { margin-top:.3rem; font-size:.8rem; color:#ccc; text-align:center; }
.weapon-output { background:#1e1e2f; border-radius:.5rem; padding:.3rem; text-align:center; margin-top:.5rem; line-height:1.3; font-size:.95rem; }
.weapon-output span { color:#4e8cff; font-weight:700; }
.small { font-size:0.85rem; color:#bbb; }
#ComplicationOutput, #ammoOutput, #RationWaterOutput, #medsOnlyOutput, #chemsOnlyOutput, #techOutput, #artifactOutput, #plantOutput { background:#1e1e2f; border-radius:.5rem; padding:.6rem; text-align:center; margin-top:.5rem; line-height:1.3; font-size:.95rem; }
.filter-row { display:flex; justify-content:space-between; gap:8px; width:100%; }
.filter-box { flex:1; }
.filter-box select { width:100%; padding:4px; font-size:14px; border-radius:6px; border:1px solid #555; background:#222; color:#fff; }
#townOutput { font-size:0.92rem; line-height:1.28; padding:0.5rem; margin-top:0.4rem; }
#townOutput b { font-size:1.05rem; }
#townOutput i { font-size:0.86rem; opacity:0.9; line-height:1.25; }
#townOutput > * { margin:0.35rem 0; }
#townOutput div[style*="margin-left"] { margin:0.3rem 0 0.3rem 12px !important; font-size:0.9rem; }
.section-spacer { height:0rem; width:100%; }
</style>
<script type="module" src="constants.js"></script>
</head>
<body>

<div class="container">
<h2>&#127922; Armor Distributor</h2>
<input type="number" id="inputValue" min="0" value="10" placeholder="Enter integer">
<input type="range" id="evennessSlider" min="0" max="1" step="0.01" value="0.5" style="display:none;">
<button onclick="distribute()">Distribute</button>
<div class="bars">
  <div class="bar-container"><div class="bar" id="bar1"><span></span></div><div class="label">Physical</div></div>
  <div class="bar-container"><div class="bar" id="bar2"><span></span></div><div class="label">Energy</div></div>
  <div class="bar-container"><div class="bar" id="bar3"><span></span></div><div class="label">Explosive</div></div>
  <div class="bar-container"><div class="bar" id="bar4"><span></span></div><div class="label">Rad</div></div>
</div>
</div>

<div class="container">
<h2>&#127962; Party Level</h2>
<input type="number" id="partyLevel" min="1" value="5" placeholder="Party Level">
<h2>&#128737;&#65039; Armor Generator</h2>
<div id="armorTitle" style="font-size:18px;text-align:center;margin-bottom:10px;">No armor generated yet</div>
<button onclick="generateArmor()">Generate Armor</button>
<h2>&#9876;&#65039; Weapon Generator</h2>
<div class="filter-row">
  <div class="filter-box">
    <select id="damageFilter">
      <option value="all">All Damage Types</option>
      <option value="P">Physical (P)</option>
      <option value="E">Energy (E)</option>
      <option value="X">Explosive (X)</option>
      <option value="R">Rad (R)</option>
    </select>
  </div>
  <div class="filter-box">
    <select id="typeFilter">
      <option value="all">all</option>
      <option value="melee">melee</option>
      <option value="range">range</option>
      <option value="short">short</option>
      <option value="mid">mid</option>
      <option value="long">long</option>
    </select>
  </div>
</div>
<button onclick="generateWeapon()">Generate Weapon</button>
<div id="weaponResult" class="weapon-output small"></div>
</div>

<div class="container"><h2>&#9888;&#65039; Complications</h2><button onclick="generateComplications()">Generate Complications</button><div id="ComplicationOutput"></div></div>
<div class="container"><h2>&#128165; Ammo</h2><button onclick="generateAmmo()">Generate Ammo</button><div id="ammoOutput"></div></div>
<div class="container"><h2>&#127838; Scrap/Rations/Water</h2><button onclick="generateRations()">Generate Items</button><div id="RationWaterOutput" style="margin-top:10px;"></div></div>
<div class="container"><h2>&#128137; Meds</h2><button onclick="generateMeds()">Generate Meds</button><div id="medsOnlyOutput"></div></div>
<div class="container"><h2>&#9763;&#65039; Mutagens</h2><button onclick="generateChems()">Generate Mutagens</button><div id="chemsOnlyOutput"></div></div>
<div class="container"><h2>&#129520; Technology</h2><button onclick="generateTech()">Generate Technology</button><div id="techOutput"></div></div>
<div class="container"><h2>&#129407; Artifact Generator</h2><button onclick="generateArtifact()">Generate Artifact</button><div id="artifactOutput"></div></div>
<div class="container"><h2>&#127807; Plant Generator</h2><button onclick="generatePlant()">Generate Plant</button><div id="plantOutput"></div></div>
<div class="container"><h2>&#127960;&#65039; Town Generator</h2><button onclick="generateTown()">Generate Town</button><div id="townOutput"></div></div>

<script type="module">
import { armorTable, weapons, complications, rationTypes, medTable, chemTable, ammoTable, grenadeTable, techTable, factions, townDescriptors, npcTable, townQuests, professionQuests, shopTypes, artifacts, plants } from './constants.js';

function rollDie(sides) { return Math.floor(Math.random() * sides) + 1; }
const slider = document.getElementById('evennessSlider');

function generateDistribution(total) {
  const evenness = parseFloat(slider.value) || 0;
  const base = total / 4;
  let parts = [];
  if (evenness === 0) {
    parts = [base, base, base, base];
  } else {
    let devs = Array.from({ length: 4 }, () => (Math.random() * 2 - 1) * evenness);
    const sumDev = devs.reduce((a, b) => a + b, 0);
    devs = devs.map(d => d - sumDev / 4);
    parts = devs.map(d => base + base * d);
    const factor = total / parts.reduce((a, b) => a + b, 0);
    parts = parts.map(p => Math.round(p * factor));
    let diff = total - parts.reduce((a, b) => a + b, 0);
    for (let i = 0; i < Math.abs(diff); i++) parts[i % 4] += diff > 0 ? 1 : -1;
  }
  return parts;
}

function distribute() {
  const total = parseInt(document.getElementById('inputValue').value) || 0;
  const parts = generateDistribution(total);
  const maxVal = Math.max(...parts, 1);
  parts.forEach((p, i) => {
    const bar = document.getElementById('bar' + (i + 1));
    bar.style.height = (p / maxVal * 120) + 'px';
    bar.querySelector('span').textContent = p;
  });
}
window.addEventListener('load', distribute);

// maxTier: forces die roll = 6, used for shop generation
function generateArmor(maxTier = false) {
  const level = parseInt(document.getElementById("partyLevel").value) || 0;
  const dieRoll = maxTier ? 6 : rollDie(6);
  const roll = Math.min(16, dieRoll + level);
  const armorEntry = armorTable.find(a => a.roll === roll);
  if (!armorEntry) return;
  let armorText = armorEntry.text;
  const defMatch = armorText.match(/\+(\d+)\s*def/i);
  if (!defMatch) return;
  let defValue = parseInt(defMatch[1], 10);
  let isHeavy = /heavy/i.test(armorText);
  if (!isHeavy && rollDie(6) <= 2) {
    isHeavy = true;
    defValue += 4;
    armorText = armorText.replace(/\+\d+\s*def/i, `+${defValue} def`);
  }
  const distribution = generateDistribution(defValue);
  const distText = `(${distribution.join(", ")})`;
  const nameMatch = armorText.match(/^([^:]+):\s*(.*)$/);
  let armorName = armorText, armorStats = "";
  if (nameMatch) { armorName = nameMatch[1]; armorStats = nameMatch[2]; }
  if (isHeavy) armorName = `<span style="color:red;font-weight:bold;">(H)</span> ${armorName}`;
  document.getElementById("armorTitle").innerHTML = `<b>${armorName}</b><br>${armorStats} ${distText}`;
}

// maxTier: forces die roll = 6, used for shop generation
function generateWeapon(maxTier = false) {
  const level = parseInt(document.getElementById('partyLevel').value) || 1;
  const dmgFilter = document.getElementById('damageFilter').value;
  const typeFilter = document.getElementById('typeFilter').value;
  const out = document.getElementById('weaponResult');
  let attempt = 0, chosen = null;
  while (attempt < 50) {
    attempt++;
    const d1 = rollDie(6), d2 = rollDie(6);
    const category = (d1 % 2 === 0 ? 'E' : 'O') + d2;
    const tierRoll = (maxTier ? 6 : rollDie(6)) + level;
    const table = weapons[category];
    if (!table) continue;
    const weapon = table.find(e => tierRoll <= e[0]) || table[table.length - 1];
    const dmgMatch = (weapon[2] || "").match(/[PEXR]/);
    const dmgType = dmgMatch ? dmgMatch[0] : "P";
    const rangeBand = weapon[4];
    let matchesType = false;
    if (typeFilter === "all") matchesType = true;
    else if (typeFilter === "melee") matchesType = (rangeBand === "melee");
    else if (typeFilter === "range") matchesType = (rangeBand !== "melee");
    else matchesType = (rangeBand === typeFilter);
    if ((dmgFilter === "all" || dmgFilter === dmgType) && matchesType) { chosen = weapon; break; }
  }
  if (!chosen) { out.innerHTML = `<span>No weapon matches your filters.</span>`; return; }
  let isHeavy = Math.random() < 1 / 3;
  let damageText = chosen[2];
  if (isHeavy) {
    const axbMatch = damageText.match(/^(\d+)x(\d+)\s*(.*)$/i);
    if (axbMatch) damageText = `${axbMatch[1]}x${parseInt(axbMatch[2]) + 1} ${axbMatch[3]}`.trim();
    else {
      const flatMatch = damageText.match(/^(\d+)\s*(.*)$/i);
      if (flatMatch) damageText = `${parseInt(flatMatch[1]) + 1} ${flatMatch[2]}`.trim();
    }
  }
  out.innerHTML = `<span style="font-size:1.25em;font-weight:bold;">${isHeavy ? "<span style='color:red;font-weight:bold;'>(H)</span> " : ""}${chosen[1]}</span><br>Damage: ${damageText} &bull; Ammo: ${chosen[3]}<br>Range: ${chosen[4]} &bull; Stat: ${chosen[5]} &bull; Value: ${chosen[6]}`;
}

function generateComplications() {
  const c = complications[Math.floor(Math.random() * complications.length)];
  document.getElementById("ComplicationOutput").innerHTML = `${c[0]} | Stat: ${c[1]}<br><i>${c[2]}</i>`;
}

function generateRations() {
  const rolls = rollDie(6) + rollDie(6);
  const counts = { "Armor/Clean": 0, "Gun/Dirty": 0, "Tech/Irradiated": 0 };
  for (let i = 0; i < rolls; i++) counts[rationTypes[Math.floor(Math.random() * rationTypes.length)]]++;
  let output = `<b>Total Items:</b> ${rolls}<br>`;
  for (const t in counts) if (counts[t] > 0) output += `${t}: ${counts[t]}<br>`;
  document.getElementById("RationWaterOutput").innerHTML = output;
}

function generateMeds() {
  const med = medTable[Math.floor(Math.random() * medTable.length)];
  document.getElementById("medsOnlyOutput").innerHTML = `<b>${med.name} x${rollDie(6) + 1}</b><br><i>${med.effect}</i>`;
}

function generateChems() {
  const chem = chemTable[Math.floor(Math.random() * chemTable.length)];
  document.getElementById("chemsOnlyOutput").innerHTML = `<b>${chem.name} x${rollDie(6) + 1}</b><br><i>${chem.effect}</i>`;
}

function rollGrenadeByLevel(level) {
  const roll = rollDie(6) + level;
  return grenadeTable.find(g => roll <= g.max);
}

function rollDice(diceStr) {
  const match = diceStr.match(/(\d*)d(\d+)([+-]\d+)?/i);
  if (!match) return 0;
  const count = parseInt(match[1], 10) || 1, sides = parseInt(match[2], 10), modifier = parseInt(match[3], 10) || 0;
  let total = 0;
  for (let i = 0; i < count; i++) total += Math.floor(Math.random() * sides) + 1;
  return Math.max(count + modifier, Math.min(total + modifier, count * sides + modifier));
}

function generateAmmo() {
  const selected = ammoTable[Math.floor(Math.random() * ammoTable.length)];
  const quantity = rollDice(selected.roll);
  const level = parseInt(document.getElementById("partyLevel").value) || 0;
  if (selected.type === "Grenades") {
    const grenade = rollGrenadeByLevel(level);
    document.getElementById("ammoOutput").innerHTML = `${quantity} x ${grenade.name}<br>${grenade.dmg}, thrown, STR, ${grenade.cost}`;
    return;
  }
  const costText = selected.cost > 0 ? `${selected.cost}c each` : "";
  document.getElementById("ammoOutput").innerHTML = `${quantity} x ${selected.type} ${costText}`;
}

function generateTech() {
  const tech = techTable[Math.floor(Math.random() * techTable.length)];
  document.getElementById("techOutput").innerHTML = `<b>${tech.name}</b><br><i>${tech.effect}</i>`;
}

function generateArtifact() {
  const artifact = artifacts[Math.floor(Math.random() * artifacts.length)];
  document.getElementById("artifactOutput").innerHTML = `<b>${artifact.name}</b><br>${artifact.effect}<br><small>(action to use, 6 = no HP cost, crit = heal 3 hp instead)</small>`;
}

function generatePlant() {
  const plant = plants[Math.floor(Math.random() * plants.length)];
  document.getElementById("plantOutput").innerHTML = `<b>${plant.name}</b><br>${plant.effect}<br><i>Generates a resource every time you level up, bulky, 100c</i>`;
}

function getRivalFaction(name) {
  const rivals = factions.filter(f => f.name !== name);
  return rivals[Math.floor(Math.random() * rivals.length)];
}

function generateTown() {
  let output = "";
  const descriptor = townDescriptors.find(t => t.roll === rollDie(6) * 10 + rollDie(6));
  output += `<b>Town Type:</b> ${descriptor?.name || "Unknown"}<br><i>${descriptor?.desc || ""}</i><div class="section-spacer"></div>`;
  const faction = factions[Math.floor(Math.random() * factions.length)];
  output += `<b>Faction:</b> ${faction.name}<br><i>${faction.desc}</i><div class="section-spacer"></div>`;
  output += `<b>Notable NPCs:</b><br>`;
  for (let i = 0; i < 3; i++) {
    const npc = npcTable.find(n => n.roll === rollDie(6) * 10 + rollDie(6));
    output += `<div style="margin-left:10px;margin-bottom:6px;"><b>${npc?.name || "Unknown"}:</b> <i>${npc?.desc || ""}</i><div class="section-spacer"></div></div>`;
  }
  let quest = townQuests.find(q => q.roll === rollDie(6) * 10 + rollDie(6))?.text || "Unknown Quest";
  if (quest.includes("X faction") || quest.includes("X enemy")) {
    quest = quest.replace(/X faction|X enemy/g, getRivalFaction(faction.name).name);
  }
  output += `<b>Main Quest:</b> ${quest}<div class="section-spacer"></div>`;
  const professions = Object.keys(professionQuests);
  const chosenProf = professions[Math.floor(Math.random() * professions.length)];
  output += `<b>Sidequest (${chosenProf}):</b> ${professionQuests[chosenProf][Math.floor(Math.random() * 3)]}<div class="section-spacer"></div>`;
  const signatureShop = shopTypes.find(s => s.name.toLowerCase().includes(faction.tag.toLowerCase())) || shopTypes[0];
  const signatureSlot = Math.floor(Math.random() * 3);
  for (let i = 0; i < 3; i++) {
    let shop;
    if (i === signatureSlot) {
      shop = signatureShop;
    } else {
      let attempts = 0;
      do { shop = shopTypes[Math.floor(Math.random() * shopTypes.length)]; attempts++; }
      while (shop.name === signatureShop.name && attempts < 10);
    }
    output += `<b>Shop ${i + 1}: ${shop.name}</b> `;
    if (shop.name === signatureShop.name) output += `<span style="color:#4e8cff;font-weight:bold;">(Faction)</span>`;
    output += `<div class="section-spacer"></div>`;
    for (let r = 0; r < 2; r++) {
      let result = "";
      // Weapons and Armor always roll max tier (die = 6) in shops
      if (shop.name === "Weapons") { generateWeapon(true); result = document.getElementById("weaponResult").innerHTML; }
      else if (shop.name === "Armor") { generateArmor(true); result = document.getElementById("armorTitle").innerHTML; }
      else if (shop.name === "Meds") { generateMeds(); result = document.getElementById("medsOnlyOutput").innerHTML; }
      else if (shop.name === "Rations" || shop.name === "Water") { generateRations(); result = document.getElementById("RationWaterOutput").innerHTML; }
      else if (shop.name === "Tech") { generateTech(); result = document.getElementById("techOutput").innerHTML; }
      else result = "<i>(no items)</i>";
      output += `<div style="margin-left:14px;margin-bottom:8px;">${result}</div><div class="section-spacer"></div>`;
    }
  }
  document.getElementById("townOutput").innerHTML = output;
}

window.distribute = distribute;
window.generateArmor = generateArmor;
window.generateWeapon = generateWeapon;
window.generateComplications = generateComplications;
window.generateRations = generateRations;
window.generateMeds = generateMeds;
window.generateChems = generateChems;
window.generateAmmo = generateAmmo;
window.generateTech = generateTech;
window.generateArtifact = generateArtifact;
window.generatePlant = generatePlant;
window.generateTown = generateTown;
</script>
</body>
</html>
