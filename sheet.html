<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FALLOUT CHARACTER SHEET</title>

  <style>
    body { overflow-x: hidden; width: 100%; margin:0; padding:0; font-family: monospace; background:#0b120b; color:#9fef9f; }
    .app { max-width:900px; margin:auto; padding:12px; background:#0f1f0f; box-shadow:0 0 20px #0f0; }
    h2 { color:#7cff7c; text-shadow:0 0 6px #0f0; margin: 0; }
    #mainTitle { white-space: nowrap; }
    .grid { display:grid; gap:8px; }
    .title { grid-template-columns:75% 23%; }

    input, textarea {
      background:#081408; color:#9fef9f;
      border:1px solid #2cff2c; padding:6px;
      font-family:monospace; width:100%; box-sizing:border-box;
    }

    .card { background:#081408; border:1px solid #2cff2c; padding:8px; }
    .center { text-align:center; }

    .stats, .armor, .hp-area, .negatives, .inventory {
      margin:10px 0;
    }

    .stats { grid-template-columns: repeat(5, 1fr); }
    
	.stat-box input {
	border: none;
	text-align: center;
	font-size: 25px;
	padding: 0;
	margin: 0;
	line-height: 1;
	width: 45px;
}

	.stat-box {
	  padding: 6px 0;
	}


	
	.grid.title.card {
	  margin-top: 10px;
	}
		
	html, body {
  width: 100%;
  overflow-x: hidden;
}
	
	    
.armor {
  display:flex;
  flex-direction:row;
  gap:8px;
  flex-wrap:nowrap;
}

.armor-box {
  flex:1 1 0;
  min-width:0;
  box-sizing:border-box;
  padding-top: 6px;
  padding-bottom: 4px;
  border: 2px solid;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  margin: 0;
}

.armor-label {
  font-weight:bold;
  margin-bottom:0px;
  display:block;
  font-size:clamp(10px, 2.5vw, 16px);
}

.armor-box input {
  text-align: center;
  font-size: clamp(25px, 8vw, 30px);
  font-weight: bold;
  line-height: 1;
  padding: 0;
  margin: 0;
  background: transparent;
  border: none;
  color: var(--armor-color);
  width: 55px;
  transform: none;
  display: inline-block;
}

.armor-label .underline {
  text-decoration: underline;
  text-underline-offset: 1px;
  text-decoration-thickness: 1px;
}

    .p-theme { background:#331111; border-color:#ff5c5c; }
    .n-theme { background:#112233; border-color:#5ca9ff; }
    .x-theme { background:#332211; border-color:#ffb85c; }
    .r-theme { background:#113311; border-color:#6dff6d; }
	
	.armor-box.p-theme input {
	  color: #ff5c5c;
	  border-color: #ff5c5c;
	}

	.armor-box.e-theme input {
	  color: #5ca9ff;
	  border-color: #5ca9ff;
	}

	.armor-box.x-theme input {
	  color: #ffb85c;
	  border-color: #ffb85c;
	}

	.armor-box.r-theme input {
	  color: #6dff6d;
	  border-color: #6dff6d;
	}

    
    .hp-area {
      display:grid;
      grid-template-columns: 1fr auto;
      gap:8px;
      align-items:stretch;
      margin:10px 0;
      min-width:0;
    }

    .hp-box {
      position:relative;
      height:180px;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:6px;
      min-width:0;
      overflow:hidden;
    }

    .hp-title {
      font-size:20px;
      letter-spacing:2px;
      margin-bottom:4px;
    }

    .hp-center {
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      width:100%;
    }

    .hp-btn {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size: clamp(18px, 4vw, 28px);
  background:#081408;
  color:#9fef9f;
  border:1px solid #2cff2c;
  padding: clamp(2px, 0.5vw, 4px) clamp(6px, 1vw, 12px);
}
    .hp-minus { left:8px; }
    .hp-plus { right:8px; }

    .hp-plus10 {
  position: absolute;
  max-width: 100%;
  overflow: hidden;
  right: 4px;
  top: 1%;
  transform: translateY(-50%);
  font-size: clamp(14px, 3vw, 20px);
  padding: clamp(2px, 0.5vw, 4px) clamp(4px, 1vw, 8px);
  background:#081408;
  color:#9fef9f;
  border:1px solid #2cff2c;
  box-shadow:0 0 6px #2cff2c;
}


	.hp-dmgbox {
	  position: absolute;
	  height:20px;
	  top: 1%;
	  left: 4px;
	  padding: 0;
	  background: #081408;
	  border: 1px solid #ff3c3c;
	  box-shadow: 0 0 6px #ff3c3c;
	}

.armor-dmg-input {
  width: 40px;
  background: transparent !important;
  border: none !important;
  outline: none !important;
  -webkit-appearance: none !important;
  -moz-appearance: none !important;
  appearance: none !important;
  color: #9fef9f;
  font-size: clamp(14px, 3vw, 20px);
  text-align: center;
  transform: translateY(-3px);
  padding: 0;
  margin: 0;
}
	
	#hp {
      font-size: 42px;
      text-align:center;
      width: 190px;
      background:#081408;
      border:1px solid #2cff2c;
      padding:4px;
    }

    .hp-lower-row {
      display:flex;
      flex-direction:row;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      gap:4px;
      margin-top:6px;
      width:100%;
    }
	
    .addiction-box {
      width: clamp(54px, 12vw, 70px);
      min-width: 0;
      font-size: clamp(8px, 2vw, 10px);
      text-align:center;
      cursor:pointer;
      background:#081408;
      border-color:#2cff2c;
      color:#9fef9f;
      box-shadow:none;
      line-height: 1.3;
      padding: 4px 0px;
    }

    .withdraw-box {
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .withdraw-box input {
  appearance: none;
  width: 20px;
  height: 20px;
  border: 1px solid #2cff2c;
  background: #081408;
  cursor: pointer;
  position: relative;
  box-shadow: 0 0 4px #2cff2c;
}

.withdraw-box input:checked {
  background: #0f2f0f;
  border-color: #2cff2c;
  box-shadow: 0 0 6px #2cff2c;
}

.withdraw-box input:checked::after {
  content: "X";
  position: absolute;
  top: -1px;
  left: 4px;
  font-size: 18px;
  font-weight: bold;
  color: #2cff2c;
}

    .uses {
      display:grid;
      grid-template-rows: repeat(3, 1fr);
      gap:6px;
      width: 60px;
      min-width: 60px;
    }

    .use-box {
      display:flex; align-items:center; justify-content:center;
      font-weight:bold; cursor:pointer; user-select:none;
      border:1px solid; padding:6px;
    }
    .use-on { background:#0f2f0f; border-color:#2cff2c; box-shadow:0 0 8px #2cff2c; }
    .use-off { background:#2a0000; border-color:#ff3c3c; color:#ff9c9c; box-shadow:0 0 8px #ff3c3c; }

    .negatives { grid-template-columns: repeat(5, 1fr); }
    .neg-card { text-align:center; min-width:0; padding:4px; }
    .neg-value { font-size:22px; }
    .neg-btn-row { display:flex; gap: 10px; justify-content:center;}
    .neg-btn { padding:1px 4px; background:#081408; color:#9fef9f; border:1px solid #2cff2c; font-size:14px; }

    .inventory { grid-template-columns:1fr; }

.backpack-row {
  display: flex;
  justify-content: center;
  margin: 8px 0 4px;
}

.backpack-box {
  font-size: 12px;
  padding: 4px 14px;
  gap: 6px;
  border: 1px solid #2cff2c;
  cursor: pointer;
  user-select: none;
}

.backpack-check {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 1px solid #2cff2c;
  margin-right: 6px;
  vertical-align: middle;
  font-size: 12px;
  line-height: 12px;
  text-align: center;
}
	
    .slot {
  display:flex;
  flex-direction:column;
  gap:6px;
  border:none;
  padding:0px;
  margin:0px;
}

.slot.drag-dragging {
  opacity: 0.35;
}

.slot.drag-over {
  border-top: 3px solid #2cff2c;
  box-shadow: 0 -4px 8px #2cff2c;
}

.slot.drag-over-bottom {
  border-bottom: 3px solid #2cff2c;
  box-shadow: 0 4px 8px #2cff2c;
}

#inventory.drag-top .slot[data-index="0"] {
  border-top: 3px solid #2cff2c;
  box-shadow: 0 -4px 8px #2cff2c;
}


    .slot-top {
      display:grid;
      grid-template-columns: 32px 1fr 36px;
      gap:6px;
      height:4.5em;
      align-items:stretch;
    }

    .slot textarea {
  flex:1;
  resize:none;
  font-size: clamp(12px, 3vw, 16px);
  line-height: 1.3em;
  min-height: 3.2em;
}

    .heavy-toggle {
      width: 33px;
      height: auto;
      border: 1px solid #2cff2c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      background: #081408;
      transition: background 0.2s, border-color 0.2s;
    }

    .heavy-toggle::before {
      content: "H";
      font-size: 26px;
      color: rgba(255, 0, 0, 0.25);
      position: absolute;
    }

    .heavy-on {
      border-color: #ff3c3c;
      background: #2a0000;
      box-shadow: 0 0 8px #ff3c3c;
    }

    .heavy-on::before {
      color: #ff3c3c;
    }

    .dropdown-toggle {
      cursor:pointer;
      font-size:18px;
      padding:2px 0;
      border:1px solid #2cff2c;
      background:#081408;
      color:#9fef9f;
      width:32px;
      text-align:center;
      user-select:none;
      touch-action: none;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .dropdown-area {
  display:none;
  padding:0;
  border:none;
  background:transparent;
}


    .dropdown-area.open {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
    }

    .inv-counter-card { padding:4px; }

    .neg-title-input {
      width:100%;
      background:#081408;
      border:1px solid #2cff2c;
      color:#9fef9f;
      padding:2px 4px;
      text-align:center;
      margin-bottom:2px;
      font-weight:bold;
    }

    .inv-counter-btn-row {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
    }

    .inv-counter-value {
      font-size:28px;
      padding:0 6px;
      text-align:center;
      min-width:40px;
    }

    .inv-counter-btn {
      padding:1px 4px;
      background:#081408;
      color:#9fef9f;
      border:1px solid #2cff2c;
      font-size:14px;
      cursor:pointer;
    }
	
.perks-btn {
  background:#081408;
  color:#9fef9f;
  border:1px solid #2cff2c;
  padding:4px 10px;
  font-family:monospace;
  cursor:pointer;
  box-shadow:0 0 6px #2cff2c;
  margin-right: 16px;
}

.back-btn {
  background:#081408;
  color:#9fef9f;
  border:1px solid #2cff2c;
  padding:4px 10px;
  font-family:monospace;
  cursor:pointer;
  box-shadow:0 0 6px #2cff2c;
  margin-bottom:10px;
}

.hidden-screen {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#081408;
  overflow-y:auto;
  z-index:999;
  color:#9fef9f;
}


.perks-content h3 {
  margin-top:20px;
  color:#9fef9f;
}

.title-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 12px 0 0;
}

.title-bar h2 { margin-left: 16px; }

.title-left {
  display: flex;
  align-items: center;
  gap: 8px;
}


#backBtn {
  margin-right: 16px;
}

.perk-header {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  overflow: hidden;
  margin-left: 16px;
}

.perk-header h3 {
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


.perk-header .triangle {
  font-size: 16px;
  transition: transform 0.2s;
}

.perk-header.collapsed .triangle {
  transform: rotate(-90deg);
}

.perk-list {
  display: none;
}

.perk-list.open {
  display: block;
}

.perk-list,
.perks-align {
  margin-left: 10px;
  margin-right: 10px;
}



.collapse-arrow {
  transition: transform 0.2s;
}

.collapse-arrow.open {
  transform: rotate(180deg);
}


.perk-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 100%;
  flex-wrap: wrap;
  margin-top: 8px;
  margin-left: 10px;
  
}

.perk-text {
  flex: 1;
  min-width: 0;
  padding-right: 10px;  
  box-sizing: border-box;
  overflow-wrap: break-word;
}


.perk-item input {
  display: none;
}

.perk-box {
  width: 18px;
  height: 18px;
  border: 2px solid #2cff2c;
  box-shadow: 0 0 6px #2cff2c;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 14px;
  line-height: 1;
}

.perk-check:checked + .perk-box::after {
  content: "✔";
  color: #9fef9f;
  text-shadow: 0 0 6px #0f0;
}

.perks-align {
  margin-left: 10px;
  margin-right: 10px;
}



#perksScreen,
.perks-content,
#mainScreen {
  max-width: 100%;
  overflow-x: hidden;
}
.perk-section {
  margin-bottom: 10px;
}

#specialWrapper.collapsed {
  display: none;
}

.major-header {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  color: #9fef9f;
  text-shadow: 0 0 6px #0f0;
  margin-left: 0px;
}

.major-header .triangle {
  font-size: 18px;
  transition: transform 0.2s;
}

.major-header.collapsed .triangle {
  transform: rotate(-90deg);
}

#notesWrapper {
  padding-right: 16px;
}
#notesHeader {
  margin-top: 32px;
}

.nav-btn {
    margin-right: 18px;
}

.stat-starred {
  color: #ffd966;
  text-shadow: 0 0 3px #ffd966;
  letter-spacing: -1px;
  white-space: nowrap;
}

.stat-starred::before,
.stat-starred::after {
  font-size: 0.75em;
  vertical-align: middle;
}

#stats b {
  font-size: 20px;
  line-height: 1;
  margin: 0 0 2px 0;
  display: inline-block;
}


.taken-toggle {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: #081408;
    border: none;
  cursor: pointer;
  user-select: none;
}


.taken-toggle input {
  display: none;
}

.taken-toggle .perk-box {
  width: 18px;
  height: 18px;
  border: 1px solid #2cff2c;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: -40px; 
  font-size: 16px;
  line-height: 1;
  margin: 0;
}


.taken-toggle .perk-text {
  font-size: 14px;
  line-height: 1;
}

.index-table {
  width: 100%;
  border-collapse: collapse;
  font-size: clamp(11px, 2.5vw, 13px);
  margin-bottom: 6px;
}

.index-table th {
  text-align: left;
  color: #7cff7c;
  border-bottom: 1px solid #2cff2c;
  padding: 3px 6px;
  font-weight: bold;
  white-space: nowrap;
}

.index-table td {
  padding: 3px 6px;
  border-bottom: 1px solid #1a3a1a;
  vertical-align: top;
}

.index-table tr:last-child td {
  border-bottom: none;
}

.index-section {
  margin-bottom: 8px;
}

.index-copyable {
  cursor: pointer;
}

.index-copyable:active td {
  color: #fff;
}

.index-copied td {
  color: #081408 !important;
  background: #2cff2c;
}



  </style>
</head>

<body>

<div class="title-bar">
  <div class="title-left"><h2 id="mainTitle">CHARACTER SHEET</h2></div>
  <button id="indexBtn" class="perks-btn">INDEX</button>
  <button id="perksBtn" class="perks-btn">PERKS</button>
</div>

  <div class="grid title card">
 
    <input id="name" placeholder="CHARACTER NAME">
    <input id="skillName" placeholder="LEVEL">
    <input id="level" placeholder="SKILL">
    <input id="caps" placeholder="CAPS" type="text">
  </div>
  
  

  <div class="grid stats" id="stats"></div>

  <div class="armor" id="armor"></div>

  <div class="hp-area">
    <div class="card hp-box">
      <div class="hp-title">HIT POINTS</div>

      <div class="hp-center">
        <button class="hp-btn hp-minus" onclick="chgHP(-1)">−</button>
		<input id="hp">
		<button class="hp-btn hp-plus" onclick="chgHP(1)">+</button>
		<button class="hp-btn hp-plus10" onclick="chgHP10()">+10%</button>
		<button class="hp-btn hp-dmgbox">
		<input id="armorDmgInput" class="armor-dmg-input" placeholder="3P"></button>
      </div>
	  

      <div class="hp-lower-row">
        <div id="addictionToggle" class="use-box addiction-box">ADDICTED</div>

        <label class="withdraw-box">
          <input type="checkbox" id="withdraw1">
        </label>

        <label class="withdraw-box">
          <input type="checkbox" id="withdraw2">
        </label>

        <div id="addictionFleshToggle" class="use-box addiction-box">CANNIBAL</div>

        <label class="withdraw-box">
          <input type="checkbox" id="withdraw3">
        </label>

        <label class="withdraw-box">
          <input type="checkbox" id="withdraw4">
        </label>
      </div>
    </div>

    <div class="uses">
      <div id="useSkill" class="use-box">SKILL</div>
      <div id="useLuck" class="use-box">LUCK</div>
      <div id="useResist" class="use-box">RESIST</div>
    </div>
  </div>

  <div class="grid negatives" id="negatives"></div>

  <div class="grid inventory" id="inventory"></div>

  <div class="backpack-row">
    <div id="backpackToggle" class="use-box backpack-box" onclick="toggleBackpack()">
      <span id="backpackCheck" class="backpack-check"></span>
      HARNESS
    </div>
  </div>
</div>

<div id="perksScreen" class="hidden-screen">
  <div class="title-bar">
  	  <div class="title-left"><h2 id="perksTitle" class="major-header"> <span class="triangle">▼</span> PERKS </h2>
	    <label class="taken-toggle">
		<input type="checkbox" id="showTakenToggle">
		<span class="perk-box"></span>
	  </label>  
	  </div>
	
  <button class="perks-btn" onclick="exportSheet()">SAVE</button> 
  <button class="perks-btn" onclick="importSheet()">LOAD</button>
  
  <button id="backBtn" class="perks-btn">SHEET</button>
  <input type="file" id="fileInput" style="display:none" />
</div>

  <div class="perks-content">
      </div>
</div>


<div id="indexScreen" class="hidden-screen">
  <div class="title-bar">
    <div class="title-left"><h2>INDEX</h2></div>
    <button class="perks-btn" id="indexBackBtn">SHEET</button>
  </div>
  <div id="indexContent" style="padding:0 16px 40px;"></div>
</div>
<script type="module">
  import { statNames, armorTypes, statAbbrev, negNames, perkData, backgroundData, weapons, recipeTable, ammoTable, grenadeTable, medTable, chemTable, techTable, artifacts, plants, armorTable, fleshTable, rationWaterTable, moraleTable } from './constants.js';

const STORAGE_KEY = "fallout_character_v10";

window.state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  name: "",
  skillName: "",
  level: "",
  caps: "",
  hp: "20/20",
  perks: {},
  perkSections: {},
  stats: Object.fromEntries(statNames.map(s => [s, ""])),
  specialStats: Object.fromEntries(statNames.map(s => [s, false])),
  armor: { Physical:"0", Energy:"0", Explosive:"0", Radiation:"0" },
  neg: Object.fromEntries(negNames.map(n => [n, 0])),
  inventory: Array.from({length:15}, () => ({
    name: "",
    heavy: false,
    dropdown: false,
    counters: [
      { title:"", value:0 },
      { title:"", value:0 },
      { title:"", value:0 }
    ]
  })),
  uses: { skill:true, luck:true, resist:true },
  addiction: false,
  addictionFlesh: false,
  withdraw1: false,
  withdraw2: false,
  withdraw3: false,
  withdraw4: false,
  backpack: false,
  starredStats: Object.fromEntries(statNames.map(s => [s, false]))
};
state.starredStats = state.starredStats || Object.fromEntries(statNames.map(s => [s, false]));
state.showTakenOnly = state.showTakenOnly ?? false;
if (state.addictionFlesh === undefined) state.addictionFlesh = false;
if (state.backpack === undefined) state.backpack = false;

function parseHP() {

  let cur = parseInt(parts[0]) || 0;

}

function updateHPColor() {
  const hpEl = document.getElementById("hp");
  const { cur, max } = parseHP();
  const pct = max ? cur / max : 0;

  if (pct <= 0.25) {
    hpEl.style.color = "#ff3b3b";
    hpEl.style.textShadow = "0 0 6px #ff3b3b";
  } else if (pct <= 0.50) {
    hpEl.style.color = "#ff7f3f";
    hpEl.style.textShadow = "0 0 6px #ff7f3f";
  } else if (pct <= 0.75) {
    hpEl.style.color = "#e6ff66";
    hpEl.style.textShadow = "0 0 6px #e6ff66";
  } else {
    hpEl.style.color = "#9fef9f";
    hpEl.style.textShadow = "0 0 6px #9fef9f";
  }
}
	window.updateHPColor = updateHPColor;

function chgHP(d) {
  let { cur, max } = parseHP();
  cur = Math.max(0, Math.min(max, cur + d));
  state.hp = `${cur}/${max}`;
  updateHPDisplay();
  updateHPColor();
  save();
}
	window.chgHP = chgHP;

function evaluateCapsExpression(expr, currentTotal) {

  let cleaned = expr.replace(/,/g, "").trim();
  if (!cleaned) return null;

  cleaned = cleaned.replace(/\s+/g, "");

  if (/^\d+[+-]$/.test(cleaned)) {
    const amt = parseInt(cleaned.slice(0, -1), 10);
    const op = cleaned.slice(-1);
    return currentTotal + (op === "+" ? amt : -amt);
  }

  if (/^[+-]\d+$/.test(cleaned)) {
    const delta = parseInt(cleaned, 10);
    return currentTotal + delta;
  }

  const opMatch = cleaned.match(/^(\d+)([+-])(\d+)$/);
  if (opMatch) {
    const base = parseInt(opMatch[1], 10);
    const op = opMatch[2];
    const addend = parseInt(opMatch[3], 10);
    const result = op === "+" ? base + addend : base - addend;
    return result;
  }

  if (/^\d+$/.test(cleaned)) {
    return parseInt(cleaned, 10);
  }

  return null;
}	
	window.evaluateCapsExpression = evaluateCapsExpression;

    e.preventDefault();
    applyCapsChange();

function applyCapsChange() {
  let raw = capsInput.value.trim();

  if (!raw) {
    state.caps = 0;
    updateCapsDisplay();
    save();
    return;
  }

  const result = evaluateCapsExpression(raw, state.caps);

  if (result === null) {
    updateCapsDisplay();
    return;
  }

  state.caps = result;
  updateCapsDisplay();
  save();
}

// ---------- ARMOR DAMAGE ----------

function applyArmorDamage(raw) {
  const match = raw.match(/^(\d+)([PNXR])$/);
  if (!match) return;

  const amount = parseInt(match[1]);
  const type = match[2];

  const armorMap = {
    P: "Physical",
    N: "Energy",
    X: "Explosive",
    R: "Radiation"
  };

  const armorType = armorMap[type];
  const armorValue = parseInt(state.armor[armorType]) || 0;

  let damage = amount - armorValue;
  if (damage < 0) damage = 0;

  let { cur, max } = parseHP();
  cur = Math.max(0, cur - damage);

  state.hp = `${cur}/${max}`;
  updateHPDisplay();
  updateHPColor();
  save();
}
	window.applyArmorDamage = applyArmorDamage;

// ---------- INVENTORY RENDER + DRAG & DROP (touch + mouse) ----------

let dragSrcIndex = null;
let ghostEl = null;
let holdTimer = null;
let isDragging = false;

function createGhost(slot) {
  ghostEl = slot.cloneNode(true);
  ghostEl.style.position = "fixed";
  ghostEl.style.pointerEvents = "none";
  ghostEl.style.opacity = "0.75";
  ghostEl.style.zIndex = "9999";
  ghostEl.style.width = slot.offsetWidth + "px";
  ghostEl.style.left = "-9999px";
  ghostEl.style.top = "-9999px";
  ghostEl.style.background = "#0f2f0f";
  ghostEl.style.border = "2px solid #2cff2c";
  ghostEl.style.boxShadow = "0 0 12px #2cff2c";
  document.body.appendChild(ghostEl);
}

function moveGhost(x, y) {
  if (!ghostEl) return;
  ghostEl.style.left = (x - ghostEl.offsetWidth / 2) + "px";
  ghostEl.style.top  = (y - 30) + "px";
}

function removeGhost() {
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
}

function getSlotAtPoint(x, y) {
  const els = document.elementsFromPoint(x, y);
  for (const el of els) {
    const slot = el.closest(".slot");
    if (slot && slot.dataset.index !== undefined) return slot;
  }
  return null;
}

function clearDragOver() {
  document.querySelectorAll(".slot").forEach(s => {
    s.classList.remove("drag-over");
    s.classList.remove("drag-over-bottom");
  });
  const invDiv = document.getElementById("inventory");
  if (invDiv) invDiv.classList.remove("drag-top");
}

function isAboveFirstSlot(y) {
  const firstSlot = document.querySelector(".slot[data-index='0']");
  if (!firstSlot) return false;
  const rect = firstSlot.getBoundingClientRect();
  return y < rect.top + rect.height * 0.35;
}

function updateDragOver(x, y) {
  clearDragOver();
  if (isAboveFirstSlot(y)) {
    document.getElementById("inventory").classList.add("drag-top");
    return;
  }
  const target = getSlotAtPoint(x, y);
  if (!target) return;
  const destIndex = parseInt(target.dataset.index);
  if (destIndex === dragSrcIndex) return;
  // Highlight the slot that will shift down (one below the insertion point)
  const nextSlot = document.querySelector(`.slot[data-index="${destIndex + 1}"]`);
  if (nextSlot) {
    nextSlot.classList.add("drag-over");
  } else {
    // Dropping at the end — highlight bottom of last slot
    target.classList.add("drag-over-bottom");
  }
}

function finishDrop(target, y) {
  clearDragOver();
  const srcSlot = document.querySelector(`.slot[data-index="${dragSrcIndex}"]`);
  if (srcSlot) srcSlot.classList.remove("drag-dragging");

  if (isAboveFirstSlot(y)) {
    const item = state.inventory.splice(dragSrcIndex, 1)[0];
    state.inventory.unshift(item);
    save();
    renderInventory();
  } else if (target) {
    const destIndex = parseInt(target.dataset.index);
    if (!isNaN(destIndex) && destIndex !== dragSrcIndex) {
      const item = state.inventory.splice(dragSrcIndex, 1)[0];
      const adjustedDest = destIndex > dragSrcIndex ? destIndex - 1 : destIndex;
      state.inventory.splice(adjustedDest + 1, 0, item);
      save();
      renderInventory();
    }
  }

  isDragging = false;
  dragSrcIndex = null;
}

function attachDragHandles(slot, i) {
  const handle = slot.querySelector(".dropdown-toggle");

  // ── TOUCH ──
  handle.addEventListener("touchstart", e => {
    const touch = e.touches[0];
    holdTimer = setTimeout(() => {
      isDragging = true;
      dragSrcIndex = i;
      slot.classList.add("drag-dragging");
    }, 200);
  }, { passive: true });

  handle.addEventListener("touchmove", e => {
    clearTimeout(holdTimer);
    if (!isDragging) return;
    e.preventDefault();
    const touch = e.touches[0];
    if (!ghostEl) {
      createGhost(slot);
      moveGhost(touch.clientX, touch.clientY);
    }
    moveGhost(touch.clientX, touch.clientY);
    updateDragOver(touch.clientX, touch.clientY);
  }, { passive: false });

  handle.addEventListener("touchend", e => {
    clearTimeout(holdTimer);
    removeGhost();
    if (!isDragging) return;
    const touch = e.changedTouches[0];
    const target = getSlotAtPoint(touch.clientX, touch.clientY);
    finishDrop(target, touch.clientY);
  });

  handle.addEventListener("touchcancel", () => {
    clearTimeout(holdTimer);
    cancelDrag(slot);
  });

  // ── MOUSE ──
  handle.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    holdTimer = setTimeout(() => {
      isDragging = true;
      dragSrcIndex = i;
      slot.classList.add("drag-dragging");
    }, 200);
  });

  window.addEventListener("mousemove", e => {
    if (!isDragging || dragSrcIndex !== i) return;
    if (!ghostEl) {
      createGhost(slot);
    }
    moveGhost(e.clientX, e.clientY);
    updateDragOver(e.clientX, e.clientY);
  });

  window.addEventListener("mouseup", e => {
    clearTimeout(holdTimer);
    removeGhost();
    if (!isDragging || dragSrcIndex !== i) return;
    const target = getSlotAtPoint(e.clientX, e.clientY);
    finishDrop(target, e.clientY);
  });
}

function cancelDrag(slot) {
  clearTimeout(holdTimer);
  removeGhost();
  clearDragOver();
  if (slot) slot.classList.remove("drag-dragging");
  isDragging = false;
  dragSrcIndex = null;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  });
}
window.copyToClipboard = copyToClipboard;

function indexTable(headers, rows) {
  let t = `<table class="index-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(r => {
    const fullText = r.join(" | ");
    const safe = fullText.replace(/'/g, "\\'");
    t += `<tr class="index-copyable" onclick="indexCopy(this,'${safe}')">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`;
  });
  t += `</tbody></table>`;
  return t;
}

function indexCopy(el, text) {
  copyToClipboard(text);
  el.classList.add("index-copied");
  setTimeout(() => el.classList.remove("index-copied"), 800);
}
window.indexCopy = indexCopy;

function buildIndexUI() {
  const el = document.getElementById("indexContent");
  if (!el) return;
  let html = "";

  // WEAPONS
  let weaponHtml = "";
  Object.entries(weaponCategories).forEach(([cat, list]) => {
    weaponHtml += `<p style="color:#7cff7c;font-size:13px;margin:10px 0 4px;">${cat}</p>`;
    weaponHtml += indexTable(["Name","Dmg","Ammo","Range","Stat","Cost"],
      list.map(w => [w[1], w[2], w[3], w[4], w[5], w[6]]));
  });
  html += indexSection("WEAPONS", weaponHtml);

  // ARMOR
  html += indexSection("ARMOR", indexTable(["Armor"],
    armorTable.map(a => [a.text])));

  // AMMO
  html += indexSection("AMMO", indexTable(["Type","Amount","Cost/unit"],
    ammoTable.map(a => [a.type, a.roll, a.cost + "c"])));

  // GRENADES
  html += indexSection("GRENADES", indexTable(["Name","Damage","Range","Stat","Cost"],
    grenadeTable.map(g => [g.name, g.dmg, "mid", "STR", g.cost])));

  // MEDS
  html += indexSection("MEDS", indexTable(["Name","Effect"],
    medTable.map(m => [m.name, m.effect])));

  // MUTAGENS
  html += indexSection("MUTAGENS", indexTable(["Name","Effect"],
    chemTable.map(c => [c.name, c.effect])));

  // TECH
  html += indexSection("TECH", indexTable(["Name","Effect"],
    techTable.map(t => [t.name, t.effect])));

  // ARTIFACTS
  html += indexSection("ARTIFACTS", indexTable(["Name","Effect"],
    artifacts.map(a => [a.name, a.effect])));

  // PLANTS
  html += indexSection("PLANTS", indexTable(["Name","Effect"],
    plants.map(p => [p.name, p.effect])));

  // FLESH
  html += indexSection("FLESH", indexTable(["Type","Effect"],
    fleshTable.map(f => [f.name, f.effect])));

  // WATER & RATIONS
  html += indexSection("WATER & RATIONS", indexTable(["Item","Effect"],
    rationWaterTable.map(r => [r.name, r.effect])));

	// RECIPES
  html += indexSection("RECIPES", indexTable(["Book","Recipe"],
    recipeTable.map(r => [r.book, r.recipe])));

		// RECIPES
  html += indexSection("MORALE", indexTable(["Value","Effect"],
    moraleTable.map(m => [m.value, m.effect))));

  el.innerHTML = html;
}
window.buildIndexUI = buildIndexUI;

function showIndexScreen() {
  buildIndexUI();
  document.getElementById("indexScreen").style.display = "block";
  window.scrollTo(0, 0);
}
window.showIndexScreen = showIndexScreen;

function hideIndexScreen() {
  document.getElementById("indexScreen").style.display = "none";
  window.scrollTo(0, 0);
}
window.hideIndexScreen = hideIndexScreen;

	window.init = init;
function toggleStatStar(el) {
  const stat = el.dataset.stat;
  const box = el.parentElement.querySelector(".stat-input");

  if (el.dataset.starred === "true") {
    el.textContent = el.dataset.base;
    el.classList.remove("stat-starred");
    el.dataset.starred = "false";
    if (box) box.classList.remove("stat-starred");

    state.starredStats[stat] = false;

  } else {
    el.dataset.base = el.textContent;
    el.textContent = `${el.dataset.base}`;
    el.classList.add("stat-starred");
    el.dataset.starred = "true";
    if (box) box.classList.add("stat-starred");

    state.starredStats[stat] = true;
  }

  save();
}
	window.toggleStatStar = toggleStatStar;


function withUnderlinedChar(word, ch) {
  const i = word.toLowerCase().indexOf(ch.toLowerCase());
  if (i === -1) {
    return word.toUpperCase();
  }
  const before = word.slice(0, i).toUpperCase();
  const target = word[i].toUpperCase();
  const after = word.slice(i + 1).toUpperCase();
  return `${before}<span class="underline">${target}</span>${after}`;
}

	window.withUnderlinedChar = withUnderlinedChar;



function exportSheet() {
  let baseName = (state.name || "fallout-character")
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

  if (!baseName) baseName = "fallout-character";

  const today = new Date();
  const dateStr = today.getFullYear() +
                 String(today.getMonth() + 1).padStart(2, '0') +
                 String(today.getDate()).padStart(2, '0');

  const suggested = `${baseName}${dateStr}.json`;

  const fileName = prompt(
    "Save character sheet as:",
    suggested
  );

  if (!fileName) return;

  const finalName = fileName.endsWith(".json") ? fileName : fileName + ".json";

  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = finalName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


	window.exportSheet = exportSheet;

function importSheet() {
  const input = document.getElementById("fileInput");
  input.click();

  input.onchange = () => {
    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = () => {
      try {
        const loaded = JSON.parse(reader.result);

       Object.assign(state, loaded);
		save();

		init();
		buildPerkUI();

		alert("Sheet loaded successfully!");

      } catch (e) {
        alert("Invalid or corrupted file.");
      }
    };

    reader.readAsText(file);
  };
}
	
	window.importSheet = importSheet;
