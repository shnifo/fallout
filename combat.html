<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5x5 Grid & Encounter Generator</title>
<style>
  body {
    background-color: #1e1e1e;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 10px;
  }
  h1 {
    margin-bottom: 10px;
    font-size: 1.3em;
  }
  button {
    background-color: #444;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1.1em;
    margin: 12px 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover {
    background-color: #666;
  }
  #grid {
    display: grid;
    grid-template-columns: 10% repeat(5, 1fr);
    gap: 3px;
    justify-items: center;
    width: 100%;
    max-width: 90vw;
    margin: 0 auto;
  }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border-radius: 8px;
    color: white;
    width: 100%;
    aspect-ratio: 1/1;
    font-size: 5vw;
    user-select: none;
  }
  .label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 4vw;
    color: #ccc;
    width: 100%;
    aspect-ratio: 1/1;
  }
  .tile:hover {
    filter: brightness(1.3);
    transform: scale(1.08);
    transition: all 0.12s;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.75; }
  }
  @media (min-width: 500px) {
    .tile { font-size: 2.2em; }
    .label { font-size: 1.4em; }
  }
  .armor-line {
    color: #9fd3ff;
  }
</style>
</head>
<body>
<h1>5×5 Encounter Generator</h1>

<div style="display:flex; justify-content:center; gap:12px; margin:12px 0;">
  <label>Party Level: <input id="partyLevel" type="number" value="5" min="1" style="width:60px; text-align:center;"></label>
  <label>Players: <input id="numPlayers" type="number" value="3" min="1" style="width:60px; text-align:center;"></label>
</div>

<button id="generate">Generate Encounter</button>

<h3 id="Ruins-display" style="margin:12px 0;">Ruins: —</h3>
<h3 id="monster-display" style="margin:12px 0;">Monsters: —</h3>
<div id="monster-armor-display" style="margin:0 0 12px; font-size:0.85em; color:#9fd3ff; line-height:1.5;"></div>
<div id="grid"></div>

<script type="module" src="constants.js"></script>
<script type="module">
  import {
    tileTypes,
    fixedWeights,
    rowLabels,
    colLabels,
    RuinsTable,
    monsterData
  } from './constants.js';

  function generateGrid() {
    const totalWeight = fixedWeights.reduce((a, b) => a + b, 0);
    const probabilities = fixedWeights.map(w => w / totalWeight);

    const gridContainer = document.getElementById("grid");
    gridContainer.innerHTML = "";

    // Corner
    gridContainer.appendChild(createLabel(""));

    // Column labels
    colLabels.forEach(c => gridContainer.appendChild(createLabel(c)));

    // Rows + tiles
    for (let r = 0; r < 5; r++) {
      gridContainer.appendChild(createLabel(rowLabels[r]));

      for (let c = 0; c < 5; c++) {
        const tileType = weightedRandom(tileTypes, probabilities);
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.style.backgroundColor = tileType.color;
        tile.textContent = tileType.symbol;
        if (tileType.name === "Special") tile.classList.add("special-glow");
        gridContainer.appendChild(tile);
      }
    }
  }

  function createLabel(text) {
    const el = document.createElement("div");
    el.className = "label";
    el.textContent = text;
    return el;
  }

  function weightedRandom(items, probs) {
    let r = Math.random();
    let sum = 0;
    for (let i = 0; i < items.length; i++) {
      sum += probs[i];
      if (r <= sum) return items[i];
    }
    return items[items.length - 1];
  }



  function generateRuins() {
    const d1 = Math.floor(Math.random() * 6) + 1;
    const d2 = Math.floor(Math.random() * 6) + 1;
    const roll = d1 * 10 + d2;
    const Ruins = RuinsTable[roll] || "Unknown Ruins";
    document.getElementById("Ruins-display").textContent = `${Ruins}`;
  }



  function tierIndexFromRoll(tierRoll) {
    if (tierRoll <= 6) return 0;
    if (tierRoll <= 8) return 1;
    if (tierRoll <= 10) return 2;
    if (tierRoll <= 12) return 3;
    if (tierRoll <= 14) return 4;
    return 5;
  }

  // === Armor Distributor (ported from the item generator) ===
  // Splits a total DEF value across Physical / Energy / Explosive / Rad,
  // mirroring generateDistribution() in the Armor Distributor module.
  function generateArmorDistribution(total, evenness = 0.5) {
    const base = total / 4;
    let parts;

    if (evenness === 0 || !total) {
      parts = [base, base, base, base];
    } else {
      let devs = Array.from({ length: 4 }, () => (Math.random() * 2 - 1) * evenness);
      const sumDev = devs.reduce((a, b) => a + b, 0);
      devs = devs.map(d => d - sumDev / 4);

      parts = devs.map(d => base + base * d);

      const factor = total / parts.reduce((a, b) => a + b, 0);
      parts = parts.map(p => Math.round(p * factor));
    }

    // fix rounding drift
    let diff = total - parts.reduce((a, b) => a + b, 0);
    for (let i = 0; i < Math.abs(diff); i++) {
      parts[i % 4] += diff > 0 ? 1 : -1;
    }

    // enforce max spread of 4
    let adjusted = true;
    while (adjusted) {
      adjusted = false;
      const maxVal = Math.max(...parts);
      const minVal = Math.min(...parts);
      if (maxVal - minVal > 4) {
        const maxIndex = parts.indexOf(maxVal);
        const minIndex = parts.indexOf(minVal);
        parts[maxIndex]--;
        parts[minIndex]++;
        adjusted = true;
      }
    }

    return parts;
  }

  function generateMonsters() {
    const level = Math.max(1, parseInt(document.getElementById("partyLevel").value) || 1);
    const players = Math.max(1, parseInt(document.getElementById("numPlayers").value) || 1);

    let prefix = Math.random() < 0.5 ? "O" : "E";
    const d2 = Math.floor(Math.random() * 6) + 1;
    const catKey = `${prefix}${d2}`;
    const cat = monsterData[catKey] || { label: "???", subs: [] };

    let totalEnemies = players + Math.floor(Math.random() * (players + 1));
    totalEnemies = Math.max(1, Math.min(12, totalEnemies));

    const tierRoll = Math.floor(Math.random() * 6) + 1 + Math.floor(level);
    const tierIdx = tierIndexFromRoll(tierRoll);
    const subtype = cat.subs[tierIdx] || { name: "???", hp: "?", notes: "" };

    const lines = [
      `${cat.label} — ${cat.notes || ""}`,
      `${totalEnemies}× ${subtype.name} (${subtype.hp} HP, ${subtype.def} DEF)`,
      subtype.notes ? `(${subtype.notes})` : ""
    ].filter(Boolean);

    document.getElementById("monster-display").textContent = `${lines.join(" · ")}`;

    // Each individual enemy gets its own independent armor roll,
    // even though they share the same base DEF value.
    const armorDisplay = document.getElementById("monster-armor-display");
    const parsedDef = parseInt(subtype.def, 10);
    if (isNaN(parsedDef) || parsedDef <= 0) {
      armorDisplay.innerHTML = "";
    } else {
      const enemyArmorLines = [];
      for (let i = 1; i <= totalEnemies; i++) {
        enemyArmorLines.push(generateArmorDistribution(parsedDef).join("/"));
      }
      armorDisplay.innerHTML = enemyArmorLines.join(" &nbsp;·&nbsp; ");
    }
  }



  // === Generate Everything ===
  function generateAll() {
    generateGrid();
    generateRuins();
    generateMonsters();
  }

  document.getElementById("generate").addEventListener("click", generateAll);

  // Initial generation
  generateAll();

	
	window.generateGrid = generateGrid;
	window.createLabel = createLabel;
	window.weightedRandom = weightedRandom;
	window.generateRuins = generateRuins;
	window.tierIndexFromRoll = tierIndexFromRoll;
	window.generateMonsters = generateMonsters;
	window.generateAll = generateAll;
	window.generateArmorDistribution = generateArmorDistribution;
</script>
</body>
</html>
